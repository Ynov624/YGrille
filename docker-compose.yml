services:
  back:
    build: ./server
    restart: unless-stopped
    environment:
      # Base Turso (la même que la version en ligne) ; sans TURSO_DATABASE_URL le
      # conteneur utiliserait un fichier SQLite interne, perdu à chaque rebuild.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}

  front:
    build: ./client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - back
