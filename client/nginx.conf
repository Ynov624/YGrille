server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Résolveur DNS embarqué de Docker : `back` doit être ré-résolu à chaque requête
  # (via la variable ci-dessous) plutôt qu'une seule fois au démarrage de nginx,
  # sinon un redémarrage du conteneur back (nouvelle IP) laisse nginx pointer vers
  # une IP morte et renvoie du 502 en boucle.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    # Pas de chemin après $backend : avec une variable, nginx ne fait plus la
    # substitution de préfixe habituelle et transmet l'URI d'origine telle
    # quelle (elle commence déjà par /api/, attendu par l'API).
    set $backend "http://back:3001";
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA (React Router) : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri /index.html;
  }
}
